<script>
    var a = parseInt(prompt("Enter the first side of the triangle:"));
    var b = parseInt(prompt("Enter the second side of the triangle:"));
    var c = parseInt(prompt("Enter the third side of the triangle:"));
    var s=(a+b+c)/2;
    var area=Math.sqrt(s*(s-a)*(s-b)*(s-c));
    
   if (a + b <= c || a + c <= b || b + c <= a){
        alert("The sides do not form a triangle.");
    } else if (a===b && b===c) {
        alert("The triangle is equilateral. Area: " + area);
    } else if (a===b || b===c || a===c) {
        alert("The triangle is isosceles. Area: " + area);
    } else {
        alert("The triangle is scalene. Area: " + area);
    }
</script>
