<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <h1>Perfect Number Checker</h1>
    Enter a number:
    <input type="text" id="num">
    <button type="button" onclick="checkPerfect()">Check</button>
</body>
<script>
    function checkPerfect() {
        var n = Number(document.getElementById("num").value);
        var sum = 0;
        for (var i = 1; i < n; i++) {
            if (n % i === 0) {
                sum += i;
            }
        }
        if (sum === n) {
            alert(n + " is a perfect number.");
        } else if (sum < n) {
            alert(n + " is a deficient number.");
        } else  {
            alert(n + " is an abundant number.");
        }
    }
</script>
